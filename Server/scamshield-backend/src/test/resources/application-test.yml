spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  datasource:
    # The container supplies URL and credentials through DynamicPropertySource.
    # Never fall through to the development database if container setup is missing.
    url: jdbc:postgresql://127.0.0.1:1/testcontainers-required
    driver-class-name: org.postgresql.Driver
    hikari:
      # Many cached Spring contexts share one disposable database server.
      maximum-pool-size: 4
      minimum-idle: 0
      connection-init-sql: SET TIME ZONE 'Asia/Ho_Chi_Minh'
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  test:
    database:
      replace: none

app:
  supabase:
    storage:
      access-key-id: test-access-key
      secret-access-key: test-secret-key
      endpoint-override: https://storage.test.invalid
  scam-check:
    ai:
      enabled: false
    retention-cleanup-enabled: false
  jwt:
    secret: test-secret-test-secret-test-secret-test-secret-0123456789
    expiration-ms: 3600000
    refresh-expiration-ms: 86400000
