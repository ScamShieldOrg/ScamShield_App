<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kết quả đăng ký đối tác ScamShield</title>
</head>
<body style="margin:0;padding:24px;background-color:#f5f7fb;font-family:Arial,Helvetica,sans-serif;color:#131b2e;line-height:1.6;">
    <div style="max-width:560px;margin:0 auto;background-color:#ffffff;border:1px solid #e2e7f0;border-radius:12px;overflow:hidden;">
        <div style="padding:20px 28px;background-color:#0b132b;color:#ffffff;font-size:20px;font-weight:bold;">
            ScamShield
        </div>
        <div style="padding:28px;">
            <h1 style="margin:0 0 16px;font-size:24px;line-height:1.3;">Thông báo kết quả đăng ký đối tác</h1>
            <p style="margin:0 0 16px;">Kính gửi {{PARTNER_NAME}},</p>
            <p style="margin:0 0 16px;">Hồ sơ đăng ký đối tác ScamShield của doanh nghiệp chưa được phê duyệt.</p>
            <p style="margin:0 0 8px;font-weight:bold;">Lý do từ chối</p>
            <div style="margin:0 0 24px;padding:14px 16px;background-color:#f5f7fb;border:1px solid #e2e7f0;border-radius:8px;">{{REJECTION_REASON}}</div>
            <p style="margin:0;color:#45464d;">Nếu cần làm rõ kết quả xét duyệt, vui lòng liên hệ đội ngũ ScamShield.</p>
        </div>
        <div style="padding:16px 28px;border-top:1px solid #e2e7f0;color:#626b7c;font-size:13px;">
            Trân trọng,<br><strong>Đội ngũ ScamShield</strong>
        </div>
    </div>
</body>
</html>
