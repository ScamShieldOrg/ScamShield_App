name: Backend tests

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - 'Server/scamshield-backend/**'
      - '.github/workflows/backend-tests.yml'

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Run backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Server/scamshield-backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: Server/scamshield-backend/pom.xml

      - name: Run backend tests
        run: ./mvnw --batch-mode --no-transfer-progress test
